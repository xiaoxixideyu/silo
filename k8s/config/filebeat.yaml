apiVersion: v1
kind: ConfigMap
metadata:
  name: filebeat-config
  namespace: silo
  labels:
    k8s-app: filebeat
data:
  filebeat.yml: |-
    # Filebeat 输入配置
    filebeat.inputs:
    - type: log
      enabled: true
      paths:
        - /app/logs/*.log*
      scan_frequency: 10s
      tags: ["silo", "application", "json"]
      json.keys_under_root: true
      json.add_error_key: true
      json.message_key: message
      # 忽略旧的日志文件
      ignore_older: 24h
      # 多行日志处理（如果需要）
      multiline:
        pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}'
        negate: true
        match: after
    
    # Elasticsearch 输出配置
    output.elasticsearch:
      hosts: ["http://elasticsearch:9200"]
      index: "silo-logs-%{[agent.version]}-%{+yyyy.MM.dd}"
      # 如果启用安全认证，取消以下注释
      # username: "elastic"
      # password: "${ELASTICSEARCH_PASSWORD}"
      ssl.verification_mode: none
      
    # ILM (Index Lifecycle Management) 配置
    setup.ilm.enabled: true
    setup.ilm.rollover_alias: "silo-logs"
    setup.ilm.pattern: "{now/d}-000001"
    setup.ilm.policy_name: "silo-logs-policy"
    
    # 模板配置
    setup.template.enabled: true
    setup.template.name: "silo-logs"
    setup.template.pattern: "silo-logs*"
    setup.template.settings:
      index.number_of_shards: 3
      index.number_of_replicas: 1
      index.refresh_interval: "5s"
      index.max_docvalue_fields_search: 200
      
    # Kibana 配置（可选）
    setup.kibana:
      host: "http://kibana:5601"
      
    # 处理器配置
    processors:
      - add_host_metadata:
          when.not.contains.tags: forwarded
      - add_cloud_metadata: ~
      - add_docker_metadata: ~
      - add_kubernetes_metadata:
          host: ${NODE_NAME:localhost}
          matchers:
            - config_path: /var/run/secrets/kubernetes.io/serviceaccount/namespace
      
      # 添加 silo 特定字段
      - add_fields:
          target: ''
          fields:
            service.name: "silo"
            service.type: "microservice"
            environment: "${SILO_APP_ENVIRONMENT:development}"
    
    # 日志级别配置
    logging.level: info
    logging.to_files: false
    logging.to_syslog: false
    logging.metrics.enabled: false